
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube RGB Controls</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <img src="icons/icon48.png" alt="" width="48" height="48">
      </div>
      <div>
        <h1>YouTube Controls</h1>
        <p class="subtitle">Your player, your settings.</p>
      </div>
    </header>

    <section class="settings">
      <label class="setting">
        <span class="setting-copy">
          <strong>Video controls</strong>
          <small>Rewind and forward 10 seconds</small>
        </span>
        <input type="checkbox" id="enabled">
        <span class="switch" aria-hidden="true"></span>
      </label>

      <label class="setting">
        <span class="setting-copy">
          <strong>RGB ambient lighting</strong>
          <small>Animated glow around the player</small>
        </span>
        <input type="checkbox" id="rgbEnabled">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </section>

    <div class="shortcut">
      <span>Skip a skippable ad</span>
      <kbd>S</kbd>
    </div>

    <p class="note">
      Changes are saved automatically. RGB lighting is currently
      animated; audio-reactive synchronization requires audio capture.
    </p>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="scripts/popup.js"></script>
</body>
</html>
